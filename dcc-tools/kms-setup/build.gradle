plugins {
    id 'application'
}

dependencies {
    // AWS SDK: the BOM fixes the version of every AWS module.
    implementation platform(libs.awssdk.bom)
    implementation libs.awssdk.kms
    implementation libs.awssdk.s3    // the Manifest bucket
    implementation libs.awssdk.sqs   // the Manifest events queue

    // BouncyCastle: only to build X.509 certificates (the JDK has no public API for that).
    implementation libs.bouncycastle.pkix
}

application {
    mainClass = 'prepare.edt.dcctools.kmssetup.KmsSetup'
}
