# Version catalogue: every dependency and plugin version lives here, in one place.
# Build files refer to them as libs.<name>, for example libs.temporal.sdk.

[versions]
quarkus = "3.40.1.2"
temporal = "1.40.0"
archunit = "1.5.1"
awssdk = "2.57.13"
bouncycastle = "1.87"

[libraries]
quarkus-bom = { module = "io.quarkus.platform:quarkus-bom", version.ref = "quarkus" }
temporal-sdk = { module = "io.temporal:temporal-sdk", version.ref = "temporal" }
temporal-testing = { module = "io.temporal:temporal-testing", version.ref = "temporal" }

# AWS SDK: its BOM fixes the version of every AWS module (not managed by the Quarkus BOM).
awssdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awssdk" }
awssdk-kms = { module = "software.amazon.awssdk:kms" }
awssdk-url-connection-client = { module = "software.amazon.awssdk:url-connection-client" }
awssdk-s3 = { module = "software.amazon.awssdk:s3" }
awssdk-sqs = { module = "software.amazon.awssdk:sqs" }

# Quarkus extensions: no version here, the Quarkus BOM decides it.
quarkus-arc = { module = "io.quarkus:quarkus-arc" }
quarkus-health = { module = "io.quarkus:quarkus-smallrye-health" }
quarkus-metrics-prometheus = { module = "io.quarkus:quarkus-micrometer-registry-prometheus" }
quarkus-logging-json = { module = "io.quarkus:quarkus-logging-json" }
quarkus-rest = { module = "io.quarkus:quarkus-rest" }

# Jackson: version from the Quarkus BOM.
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }

# Tests. JUnit versions also come from the Quarkus BOM.
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
# Testcontainers versions come from the Quarkus BOM.
testcontainers = { module = "org.testcontainers:testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
# BouncyCastle: tests only, to build a certificate for a KMS key.
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }

[plugins]
quarkus = { id = "io.quarkus", version.ref = "quarkus" }
