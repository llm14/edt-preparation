quarkus.application.name=duis-signer

# HTTP port, used only for health and metrics (the signer has no business API).
quarkus.http.port=8083

# Temporal. In Docker, the root docker-compose.yml overrides the target with EDT_TEMPORAL_TARGET=temporal:7233.
edt.temporal.target=localhost:7233
edt.temporal.namespace=edt
edt.temporal.task-queue=duis-signing
# Sign activities per second, all replicas together: stays within the KMS request quota. [CONFIRM] the quota.
edt.temporal.signing-rate-per-second=10

# Signing: JCA KeyStore and providers. Default: keys in AWS KMS (Floci locally), through our EDT-KMS provider.
# Software keys instead: keystore-type=PKCS12, keystore-provider=SUN, signature-provider=SunEC, key-password=...
edt.signing.keystore-type=KMS
edt.signing.keystore-provider=EDT-KMS
edt.signing.signature-provider=EDT-KMS
# Written by dcc-tools/kms-setup. Path relative to the duis-signer folder (dev mode); Docker overrides it.
edt.signing.certificate-store=../dcc-tools/certs/certificate-store.p12
edt.signing.certificate-store-password=edt-test-only
edt.signing.aliases.other-user=other-user
edt.signing.aliases.registered-supplier-agent=registered-supplier-agent

# AWS KMS. Locally Floci, which accepts any credentials. In production: no endpoint, no keys (IAM role).
edt.kms.endpoint=http://localhost:4566
edt.kms.region=eu-west-2
edt.kms.alias-prefix=alias/edt-
edt.kms.access-key-id=test
edt.kms.secret-access-key=test

# Signing policy: SRV allowlist per User Role. PLACEHOLDER values until DCC provides the real ones.
# An SRV contains dots, so it is quoted as a map key.
edt.policy.roles.other-user.user-id=90-B3-D5-1F-30-01-00-01
edt.policy.roles.other-user.srvs."4.1.1"=ESME,GSME
edt.policy.roles.other-user.srvs."8.2"=CHF
edt.policy.roles.registered-supplier-agent.user-id=90-B3-D5-1F-30-01-00-02
edt.policy.roles.registered-supplier-agent.srvs."4.1.1"=ESME,GSME
edt.policy.roles.registered-supplier-agent.srvs."6.15.1"=ESME

# Logging: JSON in ECS (Elastic Common Schema) format, one object per line.
quarkus.log.console.json.enabled=true
quarkus.log.console.json.log-format=ecs

# In dev and test, plain text is easier to read. %X prints the structured fields (MDC), %e the exception.
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s %X%e%n
