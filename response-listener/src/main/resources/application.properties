quarkus.application.name=response-listener

# HTTP port: health, metrics, and POST /duis/responses (Responses and DCC Alerts from the gateway).
quarkus.http.port=8084

# Temporal. In Docker, the root docker-compose.yml overrides the target with EDT_TEMPORAL_TARGET=temporal:7233.
# No task queue: the Response Listener only signals workflows, it runs none.
edt.temporal.target=localhost:7233
edt.temporal.namespace=edt

# The trusted DSP signing certificate, in the certificate store that kms-setup writes (dcc-tools/certs).
# In Docker, the root docker-compose.yml mounts it at /certs and overrides the path.
edt.dsp.certificate-store=../dcc-tools/certs/certificate-store.p12
edt.dsp.certificate-store-password=edt-test-only
edt.dsp.certificate-alias=dsp

# Logging: JSON in ECS (Elastic Common Schema) format, one object per line.
quarkus.log.console.json.enabled=true
quarkus.log.console.json.log-format=ecs

# In dev and test, plain text is easier to read. %X prints the structured fields (MDC), %e the exception.
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s %X%e%n
