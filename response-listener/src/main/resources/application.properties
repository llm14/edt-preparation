quarkus.application.name=response-listener

# HTTP port: health, metrics, and later the endpoint for Responses.
quarkus.http.port=8084

# Logging: JSON in ECS (Elastic Common Schema) format, one object per line.
quarkus.log.console.json.enabled=true
quarkus.log.console.json.log-format=ecs

# In dev and test, plain text is easier to read. %X prints the structured fields (MDC).
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s %X%n
