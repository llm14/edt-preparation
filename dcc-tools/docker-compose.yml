# The DCC side of the EDT, for local development. In production DCC provides and runs these.
# For now: Temporal (server, PostgreSQL, UI) and moto (AWS KMS). Kafka and the simulators come later.
#
#   docker network create edt     # once, shared with the root docker-compose.yml
#   ./gradlew :kms-setup:installDist   # from this folder, once and after changes
#   docker compose up -d --build        # from this folder
#   Temporal UI: http://localhost:8088
#
# Start order (enforced by depends_on):
#   postgresql -> temporal-schema (runs once, exits) -> temporal -> temporal-namespace (runs once, exits)
#                                                                -> temporal-ui

services:
  postgresql:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: creates Temporal's databases and tables, then exits.
  temporal-schema:
    image: temporalio/admin-tools:1.32.2
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      POSTGRES_SEEDS: postgresql
      POSTGRES_USER: temporal
      SQL_PASSWORD: temporal
      DB_PORT: 5432
    volumes:
      - ./temporal/scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/setup-schema.sh"]

  # The Temporal Server: stores workflow state and hands out tasks to workers.
  temporal:
    image: temporalio/server:1.32.2
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgresql
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    ports:
      - "7233:7233"   # gRPC frontend: workers and clients connect here
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 30

  # One-shot: creates the "edt" namespace, then exits.
  temporal-namespace:
    image: temporalio/admin-tools:1.32.2
    depends_on:
      temporal:
        condition: service_healthy
    volumes:
      - ./temporal/scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/create-namespace.sh"]

  # Web UI to see namespaces, workflows and their histories.
  temporal-ui:
    image: temporalio/ui:2.58.1
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: edt
    ports:
      - "8088:8080"   # host 8088 (8080 is taken on this machine)

  # AWS emulator (open source, no account). For now only KMS is used: it holds the User Role keys.
  # Everything is in memory: a restart loses the keys, and kms-setup creates new ones.
  moto:
    image: motoserver/moto:5.2.5
    ports:
      - "5000:5000"   # AWS API endpoint: http://localhost:5000 from your machine, http://moto:5000 in Docker
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 5s
      timeout: 3s
      retries: 30

  # One-shot: creates the KMS keys of the two User Roles and the certificate store, then exits.
  # Build first: ./gradlew :kms-setup:installDist (from dcc-tools/)
  kms-setup:
    build: ./kms-setup
    image: edt/kms-setup:local
    depends_on:
      moto:
        condition: service_healthy
    environment:
      EDT_KMS_ENDPOINT: http://moto:5000
      AWS_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      EDT_CERT_STORE: /certs/certificate-store.p12
      EDT_CERT_STORE_PASSWORD: edt-test-only
    volumes:
      - ./certs:/certs   # the certificate store, read later by duis-signer

networks:
  default:
    name: edt
    external: true
