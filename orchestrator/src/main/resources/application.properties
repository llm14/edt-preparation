quarkus.application.name=orchestrator

# HTTP port: health and metrics only.
quarkus.http.port=8082

# Temporal. In Docker, the root docker-compose.yml overrides the target with EDT_TEMPORAL_TARGET=temporal:7233.
edt.temporal.target=localhost:7233
edt.temporal.namespace=edt
edt.temporal.task-queue=orchestrator
edt.temporal.signing-task-queue=duis-signing
edt.temporal.send-task-queue=duis-send

# Service Request workflow. The timeout must be longer than the DSP's retry period (model); short locally to watch it.
edt.service-request.response-timeout=2m
# DSP HTTPS Gateway (locally the DSP simulator from dcc-tools). In Docker: EDT_SERVICE_REQUEST_GATEWAY_URL.
edt.service-request.gateway-url=http://localhost:8090/duis/service-requests
# The trusted DSP signing certificate, in the certificate store that kms-setup writes (dcc-tools/certs).
# In Docker, the root docker-compose.yml mounts it at /certs and overrides the path.
edt.dsp.certificate-store=../dcc-tools/certs/certificate-store.p12
edt.dsp.certificate-store-password=edt-test-only
edt.dsp.certificate-alias=dsp
# Global send rate to the DSP (all replicas together). Low locally so the effect is visible. [CONFIRM] with DCC.
edt.service-request.send-rate-per-second=1

# Batch: Pages of rows. Small values locally, so Pages, their order and continue-as-new are visible
# with the 5-row sample Manifest. [CONFIRM] production values.
edt.batch.rows-per-page=2
# Pages running at the same time; devices processed at a time = pages-at-a-time x flows-per-page.
edt.batch.pages-at-a-time=2
edt.batch.flows-per-page=2
# The Batch continues as new after this many Pages (keeps its history small).
edt.batch.pages-per-run=2
# Bytes per S3 range read of the Manifest.
edt.batch.read-chunk-bytes=65536

# AWS (S3, the Manifest bucket). Locally Floci, any credentials. In production: no endpoint, no keys (IAM role).
# In Docker, EDT_AWS_ENDPOINT=http://floci:4566.
edt.aws.endpoint=http://localhost:4566
edt.aws.region=eu-west-2
edt.aws.access-key-id=test
edt.aws.secret-access-key=test

# Kafka (in Docker: EDT_KAFKA_BOOTSTRAP_SERVERS=kafka:9092). Topics are created by dcc-tools. [CONFIRM] names with DCC.
edt.kafka.bootstrap-servers=localhost:29092
edt.kafka.flow-steps-topic=edt.flow-steps
edt.kafka.device-results-topic=edt.device-results
edt.kafka.batch-results-topic=edt.batch-results

# Logging: JSON in ECS (Elastic Common Schema) format, one object per line.
quarkus.log.console.json.enabled=true
quarkus.log.console.json.log-format=ecs

# In dev and test, plain text is easier to read. %X prints the structured fields (MDC), %e the exception.
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s %X%e%n
